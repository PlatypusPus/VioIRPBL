[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staysmart"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.118.0",
  "httpx==0.28.1",
  "rank-bm25==0.2.2",
  "scikit-learn==1.7.2",
  "uvicorn==0.37.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
